<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tariff Reclassification Fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --line: #e2e5ea; --text: #1b1f27;
    --dim: #6b7280; --accent: #2563eb; --accent-soft: #eaf1ff;
    --ok: #15803d; --ok-soft: #e8f6ec; --warn: #b45309; --warn-soft: #fdf3e3;
    --bad: #b91c1c; --bad-soft: #fdeceb; --idle: #cbd2dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           padding: 14px 26px; background: var(--card); border-bottom: 1px solid var(--line); }
  h1 { font-size: 15.5px; margin: 0; font-weight: 650; letter-spacing: .1px; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .grow { flex: 1; }
  select, button, input {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 11px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: #c3cad6; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent);
                   font-weight: 600; }
  button.primary:hover { background: #1d4ed8; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  main { padding: 20px 26px 64px; max-width: 1720px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }

  /* flow diagram, explainer style: coloured zones, numbered steps */
  /* The canvas is pannable, so it does not need a scrollbar and must not clip
     what a drag brings into view. */
  #flowCard { padding: 0; margin-bottom: 10px; overflow: hidden; position: relative; }
  /* Drawn at its own size on a canvas that scrolls, rather than shrunk to fit.
     Fitting a wide graph into a card is what made every box small: the nodes are
     designed at a readable size and the card pans, which is how a node editor
     works anyway. */
  svg#flow { width: 100%; height: 620px; display: block; cursor: grab;
             touch-action: none; }
  svg#flow.panning { cursor: grabbing; }
  #camBtns { position: absolute; bottom: 14px; right: 14px; z-index: 2; display: flex;
             gap: 6px; }
  #camBtns button { padding: 4px 10px; font-size: 12px; opacity: .8; }
  #camBtns button:hover { opacity: 1; }
  #fsBtn { position: absolute; top: 10px; right: 14px; z-index: 2; opacity: .75;
           font-size: 12px; padding: 5px 10px; }
  #fsBtn:hover { opacity: 1; }
  /* Filling the screen is what the diagram is for during a demo: the boxes stop
     competing with the table for width and the step numbers become readable from
     across a room. */
  #flowCard:fullscreen { background: var(--card); padding: 26px 34px;
                         display: flex; flex-direction: column; justify-content: center; }
  #flowCard:fullscreen svg#flow { width: 100%; height: 88vh; }
  #flowCard:fullscreen #live { padding: 14px 4px 6px; }
  #flowCard:fullscreen .worker { font-size: 15px; padding: 7px 18px; }
  #flowCard:fullscreen .flowNote { font-size: 15px; }
  #flowCard:fullscreen #replayBar { font-size: 15px; padding: 12px 8px; }
  #flow .zl { font: 700 16px ui-sans-serif, system-ui; letter-spacing: .2px; }
  #flow .zn { font: 12.5px ui-sans-serif, system-ui; fill: #94a3b8; }
  /* Direct child only. The gate badge is a rect too, and a blanket rule painted
     it white on white, which is why "operator" was an empty pill. */
  #flow .node > rect:first-of-type { fill: #fff; stroke: #dbe2ec; stroke-width: 1.5;
                       filter: drop-shadow(0 2px 5px rgba(15,23,42,.08)); }
  #flow .node.on > rect:first-of-type { stroke: var(--zc); stroke-width: 2.2; }
  #flow .node { cursor: pointer; }
  #flow .node:hover > rect:first-of-type { stroke: var(--zc); }
  #flow .nl { font: 640 15.5px ui-sans-serif, system-ui; fill: #0f172a; }
  #flow .ni { font: 700 20px ui-sans-serif, system-ui; }
  #flow .lg { font: 12.5px ui-sans-serif, system-ui; fill: #64748b; }
  #flow .subn { font: 700 13px ui-sans-serif, system-ui; }
  #flow .sub circle { transition: none; }
  #flow .ns { font: 13px ui-sans-serif, system-ui; fill: #7c8798; }
  #flow .nn { font: 700 14px ui-sans-serif, system-ui; fill: #fff; }
  #flow .gb { font: 700 10.5px ui-sans-serif, system-ui; letter-spacing: .2px; }
  /* A gate somebody else holds is drawn as a gate, not as a disabled control:
     the work is really waiting there, it is just not yours to release. */
  #flow .node.locked > rect:first-of-type { stroke-dasharray: 6 4; }
  #flow .node.mine > rect:first-of-type { stroke: #d97706; stroke-width: 2.2; }
  #flow .el { font: 13px ui-sans-serif, system-ui; fill: #9aa5b4;
              paint-order: stroke; stroke: #fff; stroke-width: 3.5px;
              stroke-linejoin: round; }
  #flow .el.on { fill: #475569; }
  #flow .es { font-weight: 700; fill: #0ea5e9; }
  .flowNote { color: var(--dim); font-size: 12.5px; padding: 2px 12px 2px; }

  /* who is working right now */
  #live { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 12px 4px;
          min-height: 34px; }
  .worker { display: flex; align-items: center; gap: 8px; font-size: 12px;
            background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46;
            border-radius: 999px; padding: 4px 12px; }
  .worker .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981;
                 animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .worker code { color: #047857; }
  .idleNote { color: var(--dim); font-size: 12px; padding: 6px 0; }
  /* The decision transcript. A spinner and an answer is what a scripted pipeline
     looks like from outside; what separates the two is the middle, so the middle
     goes on the main screen rather than behind a click. */
  #tape { border-top: 1px solid var(--line); }
  #tapeHead { display: flex; align-items: center; gap: 10px; padding: 7px 14px 2px;
              font-size: 12px; color: var(--dim); }
  #tapeHead strong { color: var(--text); font-size: 12.5px; }
  #tapeBody { height: 170px; overflow-y: auto; padding: 2px 14px 10px;
              font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #flowCard:fullscreen #tapeBody { height: 20vh; font-size: 13.5px; }
  .tl { display: flex; gap: 8px; white-space: nowrap; }
  .tl .it { color: #94a3b8; flex: none; width: 96px; overflow: hidden;
            text-overflow: ellipsis; }
  .tl .ic { flex: none; width: 13px; text-align: center; }
  .tl .tx { flex: none; }
  .tl .dt { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .tl.reject .ic { color: var(--bad); } .tl.reject .tx { color: #991b1b; }
  .tl.select .ic, .tl.select .tx { color: var(--ok); font-weight: 700; }
  .tl.tool .ic { color: var(--accent); } .tl.tool .tx { color: #1e40af; }
  .tl.verify .ic, .tl.verify .tx { color: #0f766e; }
  .tl.refuse .ic, .tl.refuse .tx { color: var(--warn); }
  .tl.error .ic, .tl.error .tx { color: var(--bad); }
  .tl.settle .ic, .tl.settle .tx { color: #64748b; }
  .tl.cite .ic, .tl.cite .tx { color: #7c3aed; }
  .tl.finding .ic, .tl.finding .tx { color: #b45309; font-weight: 600; }
  /* What each box actually does. The diagram names the steps; this says why each
     one is there, which is the part a viewer cannot infer from a label. */
  #explain { padding: 10px 14px; border-top: 1px solid var(--line); min-height: 78px; }
  #explain h4 { margin: 0 0 4px; font-size: 13px; }
  #explain p { margin: 3px 0; font-size: 12.5px; color: #475569; max-width: 96ch; }
  #explain .whyLead { color: #0f766e; font-weight: 600; }
  #explain.blank { color: var(--dim); font-size: 12.5px; display: flex;
                   align-items: center; }
  /* Following one item is the question a person actually asks: where is mine, and
     is anybody waiting on me. */
  #trace { display: none; align-items: center; gap: 12px; padding: 9px 14px;
           background: #f5f3ff; border-top: 1px solid #ddd6fe; font-size: 12.5px;
           color: #5b21b6; }
  #trace.on { display: flex; }
  #trace .who { background: #7c3aed; color: #fff; border-radius: 999px;
                padding: 2px 10px; font-size: 11px; font-weight: 600; }
  #trace .who.auto { background: #0ea5e9; }
  #trace .who.done { background: #15803d; }
  /* Same vocabulary in the table's "With" column, so the diagram, the trace bar
     and the row all name the desk the same way. */
  td .who { display: inline-block; background: #7c3aed; color: #fff;
            border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 600; }
  td .who.auto { background: #e2e8f0; color: #475569; font-weight: 500; }
  td .who.done { background: var(--ok-soft); color: var(--ok); }
  td .who.you { background: #d97706; }
  #flow .node.here rect { stroke: #7c3aed; stroke-width: 2.6; }
  tbody tr.traced td { background: #f5f3ff; }
  #replayBar { display: none; align-items: center; gap: 12px; padding: 8px 12px;
               background: #eef6ff; border-top: 1px solid #cfe2fb; font-size: 12.5px;
               color: #1e40af; border-radius: 0 0 12px 12px; }
  #replayBar.on { display: flex; }
  #scrub { flex: 1; accent-color: var(--accent); }
  .badge { background: var(--accent); color: #fff; border-radius: 999px;
           padding: 2px 10px; font-size: 11px; font-weight: 600; }
  .fileBtn { background: var(--card); border: 1px solid var(--line); border-radius: 7px;
             padding: 7px 11px; cursor: pointer; font-size: 14px; }
  .fileBtn:hover { border-color: #c3cad6; }
  .fileBtn input { display: none; }
  .mini { font-size: 10.5px; padding: 1px 6px; margin-left: 6px; opacity: 0;
          border-radius: 5px; }
  .mini2 { font-size: 11px; padding: 2px 8px; border-radius: 5px; }
  tr:hover .mini, tr.traced .mini { opacity: .8; }
  /* A catalog arrives as a spreadsheet export, so dropping the file on the page is
     the motion the officer already knows. */
  body.dragging::after { content: 'Drop the catalog export'; position: fixed;
    inset: 18px; border: 3px dashed var(--accent); border-radius: 16px; z-index: 99;
    background: rgba(37,99,235,.06); color: var(--accent); font-size: 22px;
    font-weight: 600; display: flex; align-items: center; justify-content: center; }

  .bar { display: flex; align-items: center; gap: 14px; margin: 18px 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--dim); font-weight: 500; font-size: 12px;
       padding: 9px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #f4f7fd; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px;
          font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .APPROVED, .READY, .SETTLED { color: var(--ok); background: var(--ok-soft); }
  .NEEDS_INPUT { color: var(--warn); background: var(--warn-soft); }
  .VERIFY_FAILED, .BLOCKED { color: var(--bad); background: var(--bad-soft); }
  .CLASSIFYING, .RECEIVED { color: var(--accent); background: var(--accent-soft); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .muted { color: var(--dim); }
  dialog { background: var(--card); color: var(--text); border: 1px solid var(--line);
           border-radius: 14px; max-width: 800px; width: 92vw; padding: 0;
           box-shadow: 0 18px 50px rgba(20,26,40,.18); }
  dialog::backdrop { background: rgba(20,26,40,.35); }
  .dh { padding: 15px 20px; border-bottom: 1px solid var(--line);
        display: flex; align-items: center; gap: 12px; }
  .db { padding: 16px 20px; max-height: 66vh; overflow: auto; }
  .row { display: grid; grid-template-columns: 158px 1fr; gap: 14px; padding: 7px 0;
         border-bottom: 1px solid #f0f2f5; }
  .row div:first-child { color: var(--dim); }
  .cite { border-left: 3px solid var(--accent-soft); padding: 3px 0 3px 12px; margin: 7px 0; }
  .quote { color: var(--dim); font-style: italic; }
  .err { color: var(--bad); }
  .banner { background: var(--warn-soft); border: 1px solid #f0dcb8; color: #8a5208;
            padding: 10px 14px; border-radius: 9px; margin-bottom: 16px; }
  .banner.bad { background: var(--bad-soft); border-color: #f3c9c6; color: #97211d; }
  .banner.good { background: var(--ok-soft); border-color: #c3e6cd; color: #17683a; }
  /* A refusal is the system working, so it gets said properly instead of being a
     line of colour the eye slides past. */
  #alert { max-width: 520px; }
  #alert .ah { display: flex; align-items: center; gap: 10px; padding: 18px 22px 6px; }
  #alert .icon { width: 30px; height: 30px; border-radius: 50%; display: grid;
                 place-items: center; font-size: 16px; flex: none; }
  #alert.bad .icon { background: var(--bad-soft); color: var(--bad); }
  #alert.good .icon { background: var(--ok-soft); color: var(--ok); }
  #alert h3 { margin: 0; font-size: 15px; }
  #alert .ab { padding: 4px 22px 8px 62px; color: #475569; font-size: 13.5px; }
  #alert .af { padding: 10px 22px 20px 62px; display: flex; gap: 10px; }
</style>
</head>
<body>
<header>
  <h1>Tariff Reclassification Fleet</h1>
  <span class="sub" id="snap"></span>
  <span class="grow"></span>
  <label class="sub">product line
    <select id="tenant"><option value="plant-a">plant-a</option>
      <option value="plant-b">plant-b</option></select>
  </label>
  <label class="sub">signed in as
    <select id="role"><option value="operator">operator</option>
      <option value="contributor">contributor (engineering)</option>
      <option value="approver">approver (licensed)</option></select>
  </label>
  <label class="sub">batch
    <select id="batch"><option>loading…</option></select>
  </label>
  <button id="new">New batch</button>
  <label class="fileBtn">Import CSV<input type="file" id="csv" accept=".csv,text/csv"></label>
  <a class="sub" href="/api/sample.csv" download style="text-decoration:none">sample file</a>
  <button id="replay">▶ Replay</button>
</header>

<main>
  <div id="msg"></div>

  <div class="card" id="flowCard">
    <button id="fsBtn">⤢ Full screen</button>
    <svg id="flow" viewBox="0 0 1980 620" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="camBtns">
      <button id="camFit" title="fit the whole graph">Fit</button>
      <button id="camIn">+</button><button id="camOut">−</button>
    </div>
    <div id="explain" class="blank">Hover any box to see what it does. Click a row below to follow one item.</div>
    <div id="trace"></div>
    <div id="live"></div>
    <div id="tape">
      <div id="tapeHead">
        <strong>Decision transcript</strong>
        <span id="tapeNote">every lookup, every candidate ruled out, in the order it happened</span>
        <span class="grow" style="flex:1"></span>
        <label class="sub"><input type="checkbox" id="tapeStick" checked> follow</label>
      </div>
      <div id="tapeBody"></div>
    </div>
    <div class="flowNote" id="flowNote"></div>
    <div id="replayBar">
      <span class="badge">REPLAY</span>
      <span id="replayClock" class="muted"></span>
      <input type="range" id="scrub" min="0" value="0">
      <span id="replayStep"></span>
      <select id="speed">
        <option value="120">1×</option><option value="60" selected>2×</option>
        <option value="30">4×</option><option value="12">10×</option>
      </select>
      <button id="replayToggle">Pause</button>
      <button id="replayExit">Back to live</button>
    </div>
  </div>

  <div class="bar">
    <strong id="batchLabel" class="sub"></strong>
    <span class="grow"></span>
    <span class="sub" id="filterNote"></span>
    <span class="sub" id="approveHint"></span>
    <button class="primary" id="approve" disabled>Approve batch</button>
  </div>

  <div class="card">
    <table>
      <thead><tr>
        <th style="width:34px"><input type="checkbox" id="selAll" title="select every signable row"></th>
        <th style="width:104px">Item</th><th style="width:92px">Filed as</th>
        <th>Goods</th><th style="width:126px">Now</th>
        <th style="width:70px">Duty</th><th style="width:74px">Effort</th>
        <th style="width:126px">State</th><th style="width:124px">With</th>
        <th style="width:210px">Compliance</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<dialog id="alert">
  <div class="ah"><span class="icon" id="alertIcon"></span><h3 id="alertTitle"></h3></div>
  <div class="ab" id="alertBody"></div>
  <div class="af" id="alertActions"></div>
</dialog>

<dialog id="detail">
  <div class="dh"><strong id="dTitle"></strong><span class="grow"></span>
    <button onclick="document.getElementById('detail').close()">Close</button></div>
  <div class="db" id="dBody"></div>
</dialog>

<script type="module">
import { renderFlow, flowSummary, graphBounds, NODE_STATES, NODE_INFO, STATE_NODE,
         NEXT_STEP } from '/static/flow.js';

// Only transitions since the last look get a moving dot.
let lastEvent = 0;

const $ = s => document.querySelector(s);
const hdrs = () => ({'Content-Type':'application/json',
                     'X-Role': $('#role').value, 'X-Tenant': $('#tenant').value});
let batchId = null, timer = null, filter = null;

async function api(path, opts={}) {
  const r = await fetch(path, {headers: hdrs(), ...opts});
  if (!r.ok) { const b = await r.json().catch(()=>({detail:r.statusText}));
               throw new Error(b.detail || r.statusText); }
  return r.json();
}
const note = (t, kind='') => $('#msg').innerHTML =
  t ? `<div class="banner ${kind}">${t}</div>` : '';

//: For anything the officer has to notice: a refusal, or a signature landing.
//: `actions` are [label, handler] pairs; the dialog always offers a way out.
function alertBox(title, body, kind='bad', actions=[]) {
  const dlg = $('#alert');
  dlg.className = kind;
  $('#alertIcon').textContent = kind === 'bad' ? '!' : '✓';
  $('#alertTitle').textContent = title;
  $('#alertBody').innerHTML = body;
  $('#alertActions').innerHTML = '';
  for (const [label, fn, primary] of actions) {
    const b = document.createElement('button');
    b.textContent = label;
    if (primary) b.className = 'primary';
    b.onclick = () => { dlg.close(); fn && fn(); };
    $('#alertActions').append(b);
  }
  const close = document.createElement('button');
  close.textContent = actions.length ? 'Cancel' : 'Close';
  close.onclick = () => dlg.close();
  $('#alertActions').append(close);
  dlg.showModal();
}

// ---- the canvas ---------------------------------------------------------
// Drag to move, wheel to zoom, exactly the gestures a node editor has trained
// everyone to try. The camera lives outside the render because the diagram is
// redrawn every poll and nobody wants their view snapped back twice a second.
const cam = {x: 0, y: 0, k: 1};
let dragged = false;

function applyCam() {
  const g = document.getElementById('cam');
  if (g) g.setAttribute('transform', `translate(${cam.x} ${cam.y}) scale(${cam.k})`);
}

function zoomAt(factor, px, py) {
  const k = Math.min(2.2, Math.max(0.35, cam.k * factor));
  // Keep whatever is under the pointer under the pointer.
  cam.x = px - (px - cam.x) * (k / cam.k);
  cam.y = py - (py - cam.y) * (k / cam.k);
  cam.k = k;
  applyCam();
}

//: Frame the whole graph. The drawing is wider than any card, so this is the
//: honest default rather than a feature: it is what a viewer expects on arrival.
function camFit() {
  const svg = $('#flow'), view = svg.viewBox.baseVal;
  const box = graphBounds();
  const k = Math.min(view.width / (box.width + 60), view.height / (box.height + 60), 1.4);
  cam.k = k;
  cam.x = (view.width - box.width * k) / 2 - box.x * k;
  cam.y = (view.height - box.height * k) / 2 - box.y * k;
  applyCam();
}

(function panning() {
  const svg = $('#flow');
  let from = null;
  //: Whether this pointer gesture turned into a pan. A node click that follows a
  //: drag is the tail of the drag, not a click on the node.
  dragged = false;
  const point = e => {
    const r = svg.getBoundingClientRect(), v = svg.viewBox.baseVal;
    return {x: (e.clientX - r.left) / r.width * v.width,
            y: (e.clientY - r.top) / r.height * v.height};
  };
  svg.addEventListener('pointerdown', e => {
    from = {...point(e), x0: cam.x, y0: cam.y};
    // Not captured yet, and not called a drag yet. Capturing on the way down
    // takes the click away from whatever was under the pointer, which is how
    // clicking a node stopped filtering the table.
    dragged = false;
  });
  svg.addEventListener('pointermove', e => {
    if (!from) return;
    const p = point(e);
    if (!dragged && Math.hypot(p.x - from.x, p.y - from.y) < 5) return;
    if (!dragged) { dragged = true; svg.classList.add('panning');
                    svg.setPointerCapture(e.pointerId); }
    cam.x = from.x0 + (p.x - from.x); cam.y = from.y0 + (p.y - from.y);
    applyCam();
  });
  const stop = () => { from = null; svg.classList.remove('panning');
                       // Let the click through on the next tick if it was a click.
                       setTimeout(() => { dragged = false; }, 0); };
  svg.addEventListener('pointerup', stop);
  svg.addEventListener('pointercancel', stop);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const p = point(e);
    zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y);
  }, {passive: false});
  $('#camFit').onclick = camFit;
  $('#camIn').onclick = () => zoomAt(1.2, 990, 310);
  $('#camOut').onclick = () => zoomAt(1 / 1.2, 990, 310);
})();

// ---- the decision transcript --------------------------------------------
// Lines arrive as cases land and are never rewritten, so the tape is a record
// rather than a rendering of current state. `seen` is what keeps a 1.5-second
// poll from re-appending the same case's work forever.
const ICON = {tool:'⌕', reject:'✕', select:'✓', cite:'❞', verify:'⚖',
              refuse:'?', settle:'▪', error:'!', finding:'$'};
let tape = {seen: new Set(), lines: [], batch: null};

function tapeReset() { tape = {seen: new Set(), lines: [], batch: null}; drawTape(); }

//: Anything that changes what the diagram means, rather than what it counts.
function forceRedraw() { drawn = ''; }

function tapeAppend(cases, ofBatch) {
  let added = false;
  // Switching batch or restarting a replay starts a new record rather than
  // continuing somebody else's.
  if (ofBatch && tape.batch !== ofBatch) {
    tape = {seen: new Set(), lines: [], batch: ofBatch};
    added = true;
  }
  for (const c of cases || []) {
    // Keyed on the transcript, not the case: a case that came back from
    // engineering and ran again has a second transcript, and that second run is
    // the one worth watching.
    const key = `${c.case_id}:${(c.steps || []).length}:${(c.steps || []).at(-1)?.text || ''}`;
    if (!(c.steps || []).length || tape.seen.has(key)) continue;
    tape.seen.add(key);
    for (const s of c.steps)
      tape.lines.push({...s, item_id: c.item_id, case_id: c.case_id});
    added = true;
  }
  // A long batch would otherwise grow the DOM without bound; the tail is the
  // part anybody reads, and the whole record stays in the audit trail.
  if (tape.lines.length > 600) tape.lines = tape.lines.slice(-600);
  if (added) drawTape();
}

//: Replay scrubs backwards as well as forwards, so its tape is rebuilt from the
//: events up to the playhead rather than appended to.
function tapeRebuild(cases) {
  tape = {seen: new Set(), lines: [], batch: 'replay'};
  tapeAppend(cases, 'replay');
  drawTape();
}

//: One exclusion argument usually kills a whole family of codes at once: the six
//: subheadings of 8549 all fall to the same note about waste and scrap. Printing
//: six near-identical lines renders a loop where the reasoning took one step, and
//: a reader who sees the third one concludes it is a template. So consecutive
//: rejections within a heading become one row that names every code it covers.
//: The wording of the rest is not thrown away, it is in the case detail and in
//: the audit trail, one line per candidate.
function collapse(lines) {
  const out = [];
  for (const l of lines) {
    const prev = out[out.length - 1];
    const code = l.text.split(' ')[0];
    const same = prev && prev.kind === 'reject' && l.kind === 'reject'
                 && prev.case_id === l.case_id
                 && prev.codes[0].slice(0, 4) === code.slice(0, 4);
    if (!same) { out.push({...l, codes: [code]}); continue; }
    prev.codes.push(code);
    prev.text = `${prev.codes.join(' ')} ruled out`;
    prev.ref = `${prev.codes.length} subheadings of ${code.slice(0, 4)}`;
  }
  return out;
}

function drawTape() {
  const body = $('#tapeBody');
  const shown = collapse(
    (traced ? tape.lines.filter(l => l.case_id === traced) : tape.lines)
      // The quotes belong beside the decision they support, which is the case
      // detail. On the tape they are the most expensive rows to read and the
      // least informative: a quote that resolves proves the words were copied
      // from the snapshot, not that the reasoning holds.
      .filter(l => l.kind !== 'cite'));
  body.innerHTML = shown.length ? shown.map(l => `
    <div class="tl ${l.kind}"><span class="it">${l.item_id || ''}</span>
      <span class="ic">${ICON[l.kind] || '·'}</span>
      <span class="tx">${esc(l.text)}</span>
      <span class="dt">${esc(l.detail || '')}${l.ref ? ` · ${esc(l.ref)}` : ''}</span>
    </div>`).join('')
    : '<div class="idleNote">Nothing recorded yet. Lines appear as each case is settled.</div>';
  if ($('#tapeStick').checked) body.scrollTop = body.scrollHeight;
  $('#tapeNote').textContent = shown.length
    // Candidates, not rows: the grouping above must not quietly shrink the claim.
    ? `${shown.filter(l => l.kind === 'reject')
              .reduce((n, l) => n + l.codes.length, 0)} candidates ruled out, ` +
      `${shown.filter(l => l.kind === 'tool').length} lookups` +
      (traced ? ' · showing one item' : '')
    : 'every lookup, every candidate ruled out, in the order it happened';
}

const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

//: Every batch this product line has, newest first. Without it the screen only
//: ever showed the most recent run, so a batch worth looking at again was
//: reachable only by knowing its id.
async function loadBatches(select = null) {
  const list = await api('/api/batches').catch(() => []);
  $('#batch').innerHTML = list.map(b =>
    `<option value="${b.batch_id}">${esc(b.label)} · ${b.counts._total} item(s)</option>`
  ).join('') || '<option value="">no batches</option>';
  batchId = select || list[0]?.batch_id || null;
  if (batchId) $('#batch').value = batchId;
  return list;
}

$('#batch').onchange = () => {
  batchId = $('#batch').value;
  filter = null; traced = null; traceView = null;
  $('#trace').className = '';
  tapeReset(); poll();
};

async function newBatch() {
  note('');
  try {
    const catalog = await api('/api/catalog');
    const {batch_id} = await api('/api/batches', {method:'POST', body: JSON.stringify(
      {label:'Catalog review '+new Date().toISOString().slice(0,10), items: catalog})});
    await loadBatches(batch_id); filter = null; poll();
  } catch (e) { note(e.message, 'bad'); }
}

let misses = 0;
function poll() {
  clearInterval(timer); misses = 0; lastEvent = 0; forceRedraw();
  const tick = async () => {
    if (!batchId) return;
    try {
      const [batch, flow] = await Promise.all([
        api('/api/batches/'+batchId),
        api(`/api/batches/${batchId}/flow?since=${lastEvent}`)]);
      misses = 0; note('');
      const first = !document.getElementById('cam');
      render(batch, flow, flow.moves);
      if (first) camFit();
      lastEvent = flow.last_event_id ?? lastEvent;
    } catch (e) {
      // A restarted server produces a bare "Failed to fetch". Keep polling; only
      // complain once the outage has lasted long enough to be worth mentioning.
      misses++;
      if (misses > 4) { note(`Lost the server: ${e.message}`, 'bad'); clearInterval(timer); }
    }
  };
  tick(); timer = setInterval(tick, 1500);
}

//: What the diagram is currently showing. Rebuilding the SVG destroys every
//: running animation, so a poll that found nothing new must not touch it: a dot
//: travelling an edge takes 1.4s and the poll comes round every 1.5s, which is
//: why the moving dots kept stopping halfway.
let drawn = '';

function render(data, flow, moves) {
  $('#batchLabel').textContent =
    `${data.batch.label} · ${data.batch.batch_id} · snapshot ${data.batch.snapshot_id}`;
  const signature = JSON.stringify([flow.states, flow.edges, flow.dispositions,
                                    flow.tools_used, flow.active.length,
                                    (moves || []).map(m => m.event_id),
                                    traced, filter, $('#role').value]);
  if (signature !== drawn) {
    drawn = signature;
    renderFlow($('#flow'), flow, id => {
      if (dragged) return;
      filter = (filter === id) ? null : id;
      drawn = '';
      render(data, flow);
    }, id => explainNode(id), traceView, moves, $('#role').value);
    applyCam();
  }
  $('#flowNote').textContent = flowSummary(flow);
  const busy = flow.active || [];
  $('#live').innerHTML = busy.length
    ? busy.map(w => `<span class="worker"><span class="dot"></span>
        <strong>${w.item_id}</strong>
        <span>${w.bucket ? w.bucket.toLowerCase().replace('_',' ') : ''}</span>
        <code>${w.tool}</code>
        <span class="muted">call ${w.calls}</span></span>`).join('')
    : '<span class="idleNote">No agent is running. Every case in this batch has been settled, refused, or is waiting for a signature.</span>';

  // In replay the tape is rebuilt from the playhead instead, since scrubbing
  // backwards has to take lines away again.
  if (!replay) tapeAppend(flow.cases, data.batch.batch_id);

  const shown = casesAt(filter, data.cases);
  $('#filterNote').textContent = filter
    ? `showing ${shown.length} at “${filter}”, click the node again to clear` : '';

  const effort = Object.fromEntries(flow.cases.map(c => [c.case_id, c]));
  $('#rows').innerHTML = shown.map(x => {
    const e = effort[x.case_id] || {};
    const signable = x.state === 'READY' || x.state === 'SETTLED';
    return `<tr class="${traced===x.case_id?'traced':''}" onclick="window.trace('${x.case_id}')">
      <td onclick="event.stopPropagation()">${signable
        ? `<input type="checkbox" class="pick" value="${x.case_id}"
                  ${selected.has(x.case_id)?'checked':''} onchange="window.pick(this)">`
        : ''}</td>
      <td><code>${x.item_id}</code>
          <button class="mini" onclick="event.stopPropagation();window.openCase('${x.case_id}')">details</button></td>
      <td><code class="muted">${x.prior_code}</code></td>
      <td>${x.description}${x.missing_property
          ? `<br><span class="muted">needs: ${x.missing_property} → ask ${x.ask_department||'?'}</span>`:''}</td>
      <td><code>${x.selected_code||'<span class="muted">—</span>'}</code></td>
      <td>${x.duty_rate||'<span class="muted">—</span>'}</td>
      <td class="muted">${e.tool_calls ? e.tool_calls+' calls' : '—'}</td>
      <td><span class="pill ${x.state}">${x.state.replace('_',' ').toLowerCase()}</span></td>
      <td>${desk(x.state)}</td>
      <td>${disposition(x.findings)}</td>
    </tr>`;}).join('');

  const c = data.counts;
  const ready = c.READY + c.SETTLED, held = c.NEEDS_INPUT + c.VERIFY_FAILED;
  // Drop ticks for rows that have since been signed or moved on.
  const signableIds = new Set(data.cases
    .filter(x => x.state === 'READY' || x.state === 'SETTLED').map(x => x.case_id));
  for (const id of [...selected]) if (!signableIds.has(id)) selected.delete(id);
  window.__ready = ready;
  updateApprove();
  $('#selAll').checked = ready > 0 && selected.size === ready;
  // A case is stranded when no worker is holding it, not merely because it is
  // classifying. Counting every busy case as stuck made the screen cry for help
  // at exactly the moment the system was working hardest.
  const working = new Set((flow.active || []).map(w => w.case_id));
  const stranded = data.cases.filter(
    x => x.state === 'CLASSIFYING' && !working.has(x.case_id)).length;
  $('#approveHint').innerHTML =
    ($('#role').value !== 'approver' ? 'signed in as ' + $('#role').value + ' · ' : '') +
    `${ready} ready to sign${held ? `, ${held} held back` : ''}` +
    (stranded ? ` · <button class="mini2" onclick="window.restartStranded()">restart ${stranded} stuck</button>` : '');
}

//: Which lines a node is about. Most nodes are a state, but two are not: the
//: compliance pass is about every line it found something on, and the intake is
//: about all of them. Clicking those used to filter to nothing, which reads as a
//: broken table rather than as a node with no queue.
function casesAt(node, cases) {
  if (!node) return cases;
  if (node === 'compliance') return cases.filter(c => (c.findings || []).length);
  if (node === 'intake') return cases;
  const states = NODE_STATES[node] || [];
  return cases.filter(c => states.includes(c.state));
}

//: Whose desk this line is on. The state says what happened to it; this says who
//: it is waiting for, which is the question anybody actually opens the table to
//: answer. "Nobody" is the answer for most of a batch, and saying so is the claim.
const DESK_ROLE = {NEEDS_INPUT: 'contributor', SETTLED: 'approver',
                   READY: 'approver', BLOCKED: 'operator'};

function desk(state) {
  const step = NEXT_STEP[state] || {who: '?'};
  const mine = DESK_ROLE[state] === $('#role').value;
  const cls = step.who === 'automatic' ? 'auto' : step.who === 'nobody' ? 'done' : '';
  return `<span class="who ${cls} ${mine ? 'you' : ''}">${
    mine ? 'you' : step.who}</span>`;
}

//: What the compliance pass did with this line. Two shapes only: settled here,
//: or raised for a person. Anything in between would be the system deciding
//: something it has no business deciding.
function disposition(findings) {
  if (!findings || !findings.length) return '<span class="muted">nothing owed</span>';
  const human = findings.filter(f => f.severity === 0);
  const rest = findings.filter(f => f.severity !== 0);
  const bits = [];
  if (human.length) bits.push(`<span class="pill NEEDS_INPUT">${esc(human[0].headline)}</span>`);
  for (const f of rest.slice(0, 2))
    bits.push(`<span class="muted">${esc(f.headline)}</span>`);
  if (rest.length > 2) bits.push(`<span class="muted">+${rest.length - 2}</span>`);
  return bits.join('<br>');
}

let traced = null, traceView = null;
//: Rows the officer has ticked. Empty means the whole batch, which is the normal
//: case; a selection is for the review that happens before signing part of it.
const selected = new Set();

window.pick = (el) => {
  el.checked ? selected.add(el.value) : selected.delete(el.value);
  updateApprove();
};

window.trace = async (caseId) => {
  if (traced === caseId) { traced = null; traceView = null; drawTape(); poll(); return; }
  traced = caseId;
  drawTape();
  try {
    const {case: k, events} = await api('/api/cases/'+caseId);
    const nodes = ['intake'], edges = [];
    let prev = 'intake';
    for (const e of events) {
      const node = STATE_NODE[e.to_state];
      if (!node) continue;
      edges.push(`${prev}->${node}`);
      nodes.push(node); prev = node;
    }
    const step = NEXT_STEP[k.state] || {who:'?', text:''};
    traceView = {at: STATE_NODE[k.state], nodes, edges,
                 item: k.item_id, state: k.state, step};
    const cls = step.who === 'automatic' ? 'auto' : step.who === 'nobody' ? 'done' : '';
    $('#trace').className = 'on';
    $('#trace').innerHTML = `
      <strong>${k.item_id}</strong>
      <span>${(k.bucket||'').toLowerCase().replace('_',' ')}</span>
      <span>at <strong>${NODE_INFO[traceView.at]?.label || k.state}</strong></span>
      <span>·</span>
      <span class="who ${cls}">${step.who}</span>
      <span>${step.text}</span>
      <span class="grow" style="flex:1"></span>
      ${k.tool_calls ? `<span>${k.tool_calls} tool calls</span>` : ''}
      ${actionFor(k)}
      <button onclick="window.trace('${caseId}')">Stop following</button>`;
    poll();
  } catch (e) { note(e.message, 'bad'); }
};

//: The one thing that would move this case, offered where the case is stuck.
//: Nothing is offered for a case that is already moving on its own.
function actionFor(k) {
  const role = $('#role').value;
  if (k.state === 'NEEDS_INPUT')
    return `<button class="primary" onclick="window.openCase('${k.case_id}')">Answer the question</button>`;
  if (k.state === 'VERIFY_FAILED')
    return `<button onclick="window.advance('${k.case_id}')">Re-run</button>`;
  if ((k.state === 'READY' || k.state === 'SETTLED') && role === 'approver')
    return `<button onclick="window.advance('${k.case_id}')">Approve just this one</button>`;
  return '';
}

//: The button says what it is about to do, because "approve" over a filtered
//: table is otherwise ambiguous about what it covers.
function updateApprove() {
  const ready = window.__ready || 0;
  const btn = $('#approve');
  btn.disabled = ready === 0;
  btn.textContent = selected.size
    ? `Approve ${selected.size} selected`
    : ready ? `Approve all ready (${ready})` : 'Nothing to approve';
}

$('#selAll').onchange = (e) => {
  selected.clear();
  if (e.target.checked)
    document.querySelectorAll('.pick').forEach(el => { el.checked = true;
                                                       selected.add(el.value); });
  else document.querySelectorAll('.pick').forEach(el => el.checked = false);
  updateApprove();
};

window.restartStranded = async () => {
  try {
    const r = await api(`/api/batches/${batchId}/restart-stranded`, {method:'POST'});
    note(r.restarted ? `Restarted ${r.restarted} case(s) that no worker was holding.`
                     : 'Nothing was stranded.', 'good');
  } catch (e) { note(e.message, 'bad'); }
};

window.advance = async (caseId) => {
  try {
    const r = await api(`/api/cases/${caseId}/advance`, {method:'POST'});
    note(`Moved to ${r.state.toLowerCase().replace('_',' ')}.`, 'good');
    if (traced === caseId) { traced = null; await window.trace(caseId); }
  } catch (e) {
    const forbidden = /cannot do this|allowed:/.test(e.message);
    if (forbidden)
      alertBox('Not your signature to give',
        `You are signed in as <strong>${$('#role').value}</strong>. ` + e.message,
        'bad', [['Switch to approver', window.beApprover, true]]);
    else alertBox('That case did not move', e.message, 'bad');
  }
};

function explainNode(id) {
  const info = NODE_INFO[id];
  const box = $('#explain');
  if (!info) { box.className = 'blank';
               box.textContent = 'Hover any box to see what it does.'; return; }
  box.className = '';
  box.innerHTML = `<h4>${info.label}</h4><p>${info.what}</p>
                   <p><span class="whyLead">Why it exists.</span> ${info.why}</p>`;
}

window.openCase = async (id) => {
  try {
    const {case: k, events} = await api('/api/cases/'+id);
    $('#dTitle').textContent = `${k.item_id} · ${k.state.replace('_',' ').toLowerCase()}`;
    const cites = (k.citations||[]).map(c =>
      `<div class="cite"><code>${c.kind}</code> · ${c.ref}
        ${c.quote ? `<div class="quote">“${c.quote}”</div>`:''}</div>`).join('')
      || '<span class="muted">—</span>';
    const rows = [
      ['Filed as', `<code>${k.prior_code}</code> <span class="muted">(2017 edition)</span>`],
      ['Table offered', `${(k.candidates||[]).length} candidate(s) <span class="muted">— the correlation table has no legal status</span>`],
      ['Selected', k.selected_code ? `<code>${k.selected_code}</code>` : '<span class="muted">none</span>'],
      ['Runner-up', k.runner_up_code ? `<code>${k.runner_up_code}</code>` : '<span class="muted">—</span>'],
      ['What separates them', k.distinguishing_fact || '<span class="muted">—</span>'],
      ['Duty', k.duty_rate ? `${k.duty_rate}${k.prior_duty_rate?` <span class="muted">(was ${k.prior_duty_rate})</span>`:''}` : '<span class="muted">—</span>'],
      ['Confidence', k.confidence ?? '<span class="muted">—</span>'],
      ['Effort', k.tool_calls ? `${k.tool_calls} tool calls · ${k.seconds}s${
          (k.tools_used||[]).length ? ' · '+k.tools_used.map(t=>`${t[0]} ${t[1]}`).join(', ') : ''}`
        : '<span class="muted">settled without a model</span>'],
      k.missing_property ? ['Missing', `${k.missing_property}<br><span class="muted">ask ${k.ask_department||'?'}</span>`] : null,
      k.verify_reason ? ['Verifier', `<span class="err">${k.verify_reason}</span>`] : null,
      ['How it got there', (k.steps || []).length
        ? `<div style="font:12px/1.6 ui-monospace,Menlo,monospace">` + k.steps.map(s =>
            `<div class="tl ${s.kind}"><span class="ic">${ICON[s.kind]||'·'}</span>
              <span class="tx">${esc(s.text)}</span>
              <span class="dt">${esc(s.detail||'')}${s.ref?` · ${esc(s.ref)}`:''}</span>
            </div>`).join('') + '</div>'
        : '<span class="muted">—</span>'],
      ['Reasoning', k.reasoning || '<span class="muted">—</span>'],
      ['Evidence', cites],
      ['History', events.map(e =>
        `<div class="muted">${e.at} · ${e.from_state} → ${e.to_state} · ${e.actor}${
          e.detail?` · ${e.detail.slice(0,140)}`:''}</div>`).join('')],
    ].filter(Boolean);
    let html = rows.map(([a,b]) => `<div class="row"><div>${a}</div><div>${b}</div></div>`).join('');
    const act = actionFor(k);
    if (act && k.state !== 'NEEDS_INPUT')
      html += `<div class="row"><div>Move it on</div><div>${act}
        <div class="muted" style="margin-top:6px">The batch signature is the normal
        path; this is for a straggler that arrived after the rest were signed.</div>
      </div></div>`;
    if (k.state === 'NEEDS_INPUT') html += `
      <div class="row"><div>Answer it</div><div>
        <input id="factVal" placeholder="${k.missing_property||'the missing fact'}" style="width:58%">
        <button class="primary" onclick="window.sendFact('${k.case_id}')">Submit and re-run</button>
        <div class="muted" style="margin-top:6px">the contributor role is enough here, and it still cannot approve</div>
      </div></div>`;
    $('#dBody').innerHTML = html;
    $('#detail').showModal();
  } catch (e) { note(e.message,'bad'); }
};

window.sendFact = async (id) => {
  try {
    await api(`/api/cases/${id}/fact`, {method:'POST',
      body: JSON.stringify({value: $('#factVal').value})});
    $('#detail').close(); note('Sent to the queue. The case re-runs with that fact.','good');
  } catch (e) { note(e.message,'bad'); }
};

// ---- replay -------------------------------------------------------------
// Replays the recorded event log of a real run. Nothing here is invented: the
// states, the counts and the order all come from case_events. Live mode is the
// system working; replay is the same run, played at a pace a camera can follow.
let replay = null;

const EMPTY = () => ({
  states: {RECEIVED:0,SETTLED:0,CLASSIFYING:0,NEEDS_INPUT:0,VERIFY_FAILED:0,
           READY:0,APPROVED:0,BLOCKED:0},
  edges: {}, agent: {cases:0,tool_calls:0,seconds:0,worst_case_tools:0},
  tools_used: {}, active: [], cases: [],
});

const SETTLED_STATES = new Set(['SETTLED','READY','NEEDS_INPUT','VERIFY_FAILED','APPROVED']);

//: What this case was last seen calling. A case that has not called anything yet
//: is genuinely just starting, and says so.
function lastToolOf(e) {
  const calls = (e.steps || []).filter(s => s.kind === 'tool');
  return calls.length ? calls[calls.length - 1].text.split('(')[0] : 'starting';
}

function stateAt(tl, upto) {
  const f = EMPTY(), seen = {}, byCase = {};
  f.states.RECEIVED = tl.total_cases;
  for (let i = 0; i < upto; i++) {
    const e = tl.events[i];
    f.states[e.from_state] = Math.max((f.states[e.from_state] || 0) - 1, 0);
    f.states[e.to_state] = (f.states[e.to_state] || 0) + 1;
    const k = `${e.from_state}->${e.to_state}`;
    f.edges[k] = (f.edges[k] || 0) + 1;
    byCase[e.case_id] = e;
    if (e.to_state === 'CLASSIFYING' && !seen[e.case_id]) seen[e.case_id] = true;
  }
  const agentCases = Object.values(byCase).filter(e => e.route === 'AGENT');
  f.agent = {
    cases: new Set(agentCases.map(e => e.case_id)).size,
    tool_calls: agentCases.reduce((s, e) => s + (e.tool_calls || 0), 0),
    seconds: Math.round(agentCases.reduce((s, e) => s + (e.seconds || 0), 0) * 10) / 10,
    worst_case_tools: agentCases.reduce((m, e) => Math.max(m, e.tool_calls || 0), 0),
  };
  // Anything mid-flight at this point in the recording. The tool name is the one
  // the case was last recorded calling: a placeholder here would be the one part
  // of the replay that was not in the run.
  f.active = Object.values(byCase)
    .filter(e => e.to_state === 'CLASSIFYING')
    .map(e => ({case_id: e.case_id, item_id: e.item_id, bucket: e.bucket,
                tool: lastToolOf(e), calls: e.tool_calls || 0}));
  f.cases = Object.values(byCase).map(e => ({
    case_id: e.case_id, item_id: e.item_id, state: e.to_state, route: e.route,
    bucket: e.bucket, tool_calls: e.tool_calls, seconds: e.seconds,
    selected_code: e.selected_code, missing_property: e.missing_property,
    ask_department: e.ask_department,
    // The transcript is written when the case is settled, so showing it against
    // an earlier event would let the replay know the answer before the run did.
    steps: SETTLED_STATES.has(e.to_state) ? (e.steps || []) : []}));
  return f;
}

function drawReplay() {
  const {tl, pos, batchCases} = replay;
  const flow = stateAt(tl, pos);
  const shownCases = batchCases.map(c => {
    const e = tl.events.slice(0, pos).filter(x => x.case_id === c.case_id).pop();
    return e ? {...c, state: e.to_state, selected_code: e.selected_code} 
             : {...c, state: 'RECEIVED', selected_code: null};
  });
  const justMoved = pos > 0 ? [{from: tl.events[pos-1].from_state,
                               to: tl.events[pos-1].to_state,
                               item_id: tl.events[pos-1].item_id}] : [];
  render({batch: tl.batch, counts: countsOf(flow), cases: shownCases}, flow, justMoved);
  tapeRebuild(flow.cases);
  $('#replayStep').textContent = `${pos} / ${tl.events.length}`;
  $('#replayClock').textContent = pos ? tl.events[pos-1].at.replace('T',' ').slice(0,19) : '';
  $('#scrub').value = pos;
}

const countsOf = f => ({...f.states,
  _deterministic: f.edges['RECEIVED->SETTLED'] || 0,
  _agent: f.edges['RECEIVED->CLASSIFYING'] || 0,
  _total: Object.values(f.states).reduce((a,b)=>a+b,0)});

async function startReplay() {
  if (!batchId) return;
  clearInterval(timer);
  const [tl, batch] = await Promise.all([
    api(`/api/batches/${batchId}/timeline`), api('/api/batches/'+batchId)]);
  if (!tl.events.length) { note('Nothing recorded for this batch yet.', 'bad'); return; }
  replay = {tl, pos: 0, batchCases: batch.cases, playing: true, ticker: null};
  $('#scrub').max = tl.events.length;
  $('#replayBar').classList.add('on');
  $('#replayToggle').textContent = 'Pause';
  tick();
}

function tick() {
  clearInterval(replay.ticker);
  replay.ticker = setInterval(() => {
    if (!replay.playing) return;
    if (replay.pos >= replay.tl.events.length) { replay.playing = false;
      $('#replayToggle').textContent = 'Replay again'; return; }
    replay.pos++; drawReplay();
  }, Number($('#speed').value) * 4);
  drawReplay();
}

$('#fsBtn').onclick = () => {
  const card = $('#flowCard');
  if (document.fullscreenElement) document.exitFullscreen();
  else card.requestFullscreen?.();
};
document.addEventListener('fullscreenchange', () => {
  $('#fsBtn').textContent = document.fullscreenElement ? '⤡ Exit full screen' : '⤢ Full screen';
});

$('#replay').onclick = startReplay;
$('#replayToggle').onclick = () => {
  if (replay.pos >= replay.tl.events.length) { replay.pos = 0; }
  replay.playing = !replay.playing;
  $('#replayToggle').textContent = replay.playing ? 'Pause' : 'Play';
  if (replay.playing) tick();
};
$('#speed').onchange = () => replay && tick();
$('#scrub').oninput = () => { if (!replay) return;
  replay.playing = false; $('#replayToggle').textContent = 'Play';
  replay.pos = Number($('#scrub').value); drawReplay(); };
$('#replayExit').onclick = () => {
  clearInterval(replay?.ticker); replay = null;
  $('#replayBar').classList.remove('on'); tapeReset(); poll();
};
$('#tapeStick').onchange = drawTape;

async function importCsv(file) {
  if (!file) return;
  note(`Reading ${file.name}…`);
  const body = new FormData();
  body.append('file', file);
  body.append('label', file.name);
  try {
    const r = await fetch('/api/batches/import', {
      method: 'POST', body,
      headers: {'X-Role': $('#role').value, 'X-Tenant': $('#tenant').value}});
    const out = await r.json();
    if (!r.ok) throw new Error(out.detail || r.statusText);
    await loadBatches(out.batch_id); filter = null;
    note(`Imported ${out.items} item(s) from ${file.name}. Work has started.`, 'good');
    poll();
  } catch (e) { alertBox('That file could not be imported', e.message, 'bad'); }
}

$('#csv').onchange = e => { importCsv(e.target.files[0]); e.target.value = ''; };
['dragenter','dragover'].forEach(t => document.addEventListener(t, e => {
  e.preventDefault(); document.body.classList.add('dragging'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => {
  e.preventDefault();
  if (t === 'drop' || e.relatedTarget === null) document.body.classList.remove('dragging');
  if (t === 'drop') importCsv(e.dataTransfer.files[0]); }));

$('#new').onclick = newBatch;
$('#approve').onclick = async () => {
  try {
    const picked = selected.size ? [...selected] : null;
    const r = await api(`/api/batches/${batchId}/approve`, {method:'POST',
      body: JSON.stringify({case_ids: picked})});
    selected.clear();
    const held = r.held.length
      ? `<br><br>${r.held.length} item(s) were held back: ` +
        `${r.held.map(h=>h.state.toLowerCase().replace('_',' ')).join(', ')}. ` +
        `A batch signature does not carry through anything the verifier refused or ` +
        `anything still waiting on a fact.`
      : '';
    alertBox('Signed', `Approved ${r.approved} item(s) in one action.${held}`, 'good');
  } catch (e) { note(e.message,'bad'); }
};
$('#role').onchange = () => batchId && poll();
$('#tenant').onchange = async () => {
  const list = await loadBatches(); filter = null;
  if (batchId) poll();
  else { clearInterval(timer); $('#rows').innerHTML=''; $('#flow').innerHTML='';
         $('#flowNote').textContent=''; $('#batchLabel').textContent='';
         note('No batches for this product line. The isolation is enforced on read, not hidden in the page.'); }
};

(async () => {
  const h = await fetch('/health').then(r=>r.json());
  $('#snap').textContent = `snapshot ${h.snapshot}`;
  const list = await loadBatches();
  if (list.length) poll();
})();
</script>
